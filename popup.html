<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>예매 버튼 감시</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <h1>예매 버튼 감시</h1>
      <dl>
        <dt>공연</dt><dd id="show-title">확인 중…</dd>
        <dt>버튼</dt><dd id="button-label">확인 중…</dd>
        <dt>상태</dt><dd id="status" role="status" aria-live="polite">확인 중…</dd>
      </dl>
      <div class="actions">
        <button id="start" type="button" disabled>감시 시작</button>
        <button id="stop" type="button" disabled>감시 중지</button>
      </div>
      <p class="notice">시작할 때 버튼이 이미 활성화되어 있으면 즉시 한 번 클릭합니다.</p>
      <p id="click-record" class="record" hidden></p>
    </main>
  </body>
</html>
